version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_MODEL=ollama/llama3.1:8b
      - LLM_API_BASE=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=axonify_docs
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      qdrant:
        condition: service_healthy
    command: uvicorn rag.api.main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  qdrant_storage:

networks:
  default:
    name: rag_network
